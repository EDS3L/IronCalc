name: Ordovita fork

# Builds and checks the Ordovita branches of the fork: the engine's own tests,
# a comparison with the upstream release on lookup-heavy sheets (time and
# identical results), the web build used by the Ordovita app and the Node.js
# bindings (linux-x64-gnu, darwin-arm64) for its server-side engine.

on:
  push:
    branches: ["ordovita/**"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BASE_TAG: v0.9.1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Engine tests
        run: cargo test -p ironcalc_base

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build this branch (nodejs and web)
        working-directory: bindings/wasm
        run: |
          wasm-pack build --release --target nodejs --out-dir /tmp/after-node
          wasm-pack build --release --target web --out-dir /tmp/after-web
      - name: Build the upstream release
        run: |
          git worktree add /tmp/base "$BASE_TAG"
          cd /tmp/base/bindings/wasm
          wasm-pack build --release --target nodejs --out-dir /tmp/before-node
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Node build for local benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: ironcalc-wasm-node
          path: /tmp/after-node
          retention-days: 14
      - name: Compare
        timeout-minutes: 20
        run: node ci/ordovita-bench.mjs /tmp/before-node /tmp/after-node | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Web build for the app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironcalc-wasm-web
          path: /tmp/after-web
          retention-days: 14

  nodejs-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
      options: --user 0:0
    defaults:
      run:
        working-directory: bindings/nodejs
    steps:
      - uses: actions/checkout@v6
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: nodejs-linux-x64-gnu
      - name: Build
        run: |
          set -e
          git config --global --add safe.directory '*'
          # The image's own toolchain cannot be updated in place (overlayfs
          # rename error), so a separate one is installed next to it.
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm run build --target x86_64-unknown-linux-gnu
      - name: Test
        run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: ironcalc-nodejs-linux-x64-gnu
          path: |
            bindings/nodejs/nodejs.*.node
            bindings/nodejs/index.js
            bindings/nodejs/index.d.ts
          if-no-files-found: error
          retention-days: 14

  nodejs-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: bindings/nodejs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: aarch64-apple-darwin
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: nodejs-darwin-arm64
      - name: Build
        run: |
          set -e
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm run build --target aarch64-apple-darwin
      - name: Test
        run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: ironcalc-nodejs-darwin-arm64
          path: bindings/nodejs/nodejs.*.node
          if-no-files-found: error
          retention-days: 14

  nodejs:
    needs: [nodejs-linux, nodejs-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ironcalc-nodejs-*
          path: out
          merge-multiple: true
      - name: Check the Linux binding in node:22-slim
        run: |
          set -e
          ls -la out
          docker run --rm -v "$PWD/out:/pkg:ro" -w /pkg node:22-slim node -e '
            const { UserModel } = require("/pkg/index.js");
            const m = new UserModel("check");
            m.setUserInput(0, 1, 1, "=1+2");
            const x = UserModel.fromXlsxBytes(m.toXlsxBytes(), "check");
            if (x.getCellValue(0, 1, 1) !== 3) process.exit(1);
            console.log("ok", process.version);'
      - uses: actions/upload-artifact@v4
        with:
          name: ironcalc-nodejs
          path: out
          if-no-files-found: error
          retention-days: 14
